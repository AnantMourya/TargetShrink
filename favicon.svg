<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#5865f2"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb459e"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="16" fill="#0a0d16"/>
  <!-- Outer Target Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#targetGrad)" stroke-width="4"/>
  <!-- Middle Ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
  <!-- Center Bullseye -->
  <circle cx="32" cy="32" r="8" fill="url(#innerGrad)"/>
  <!-- Center Dot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
